# Analyzer, unit tests, and optional OAP gRPC smoke (verify_native --quick).
name: CI

# OAP image literal in docker run (services.*.image cannot use env on GHA).
# Keep scripts/run-ci-github-like.ps1 / .sh $OapDockerImage in sync.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Root package is pure Dart; `example/` needs Flutter SDK (see `dart pub get --help`).
      - name: Pub get
        run: dart pub get --no-example

      - name: Analyze
        run: dart analyze lib bin test

      - name: Test
        run: dart test

  smoke-oap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pub get
        run: dart pub get --no-example

      - name: Start OAP (10.1.0 standalone)
        run: |
          docker rm -f ci-oap 2>/dev/null || true
          docker run -d --name ci-oap \
            -p 11800:11800 \
            -e SW_HEALTH_CHECKER=default \
            apache/skywalking-oap-server:10.1.0
          for i in $(seq 1 90); do
            if (echo >/dev/tcp/127.0.0.1/11800) 2>/dev/null; then
              echo "OAP TCP 11800 open after ${i} attempts; warm-up 20s for gRPC..."
              sleep 20
              exit 0
            fi
            sleep 2
          done
          echo "OAP failed to listen on 11800; container logs:"
          docker logs ci-oap || true
          exit 1

      - name: verify_native --quick
        env:
          SW_AGENT_COLLECTOR_BACKEND_SERVICES: 127.0.0.1:11800
          SKYWALKING_SERVICE_NAME: ci-smoke-my-app
        run: |
          for attempt in 1 2; do
            echo "verify_native attempt $attempt/2"
            if timeout 60 dart run bin/verify_native.dart --quick; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "retry in 10s..."
              sleep 10
            fi
          done
          echo "verify_native failed; OAP logs:"
          docker logs ci-oap || true
          exit 1

      - name: Stop OAP
        if: always()
        run: docker rm -f ci-oap 2>/dev/null || true
