# Analyzer, unit tests, and optional OAP gRPC smoke (verify_native --quick).
name: CI

# OAP image for smoke-oap must be a literal here (services.*.image cannot use env context).
# Keep scripts/run-ci-github-like.ps1 $OapDockerImage in sync when bumping.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Root package is pure Dart; `example/` needs Flutter SDK (see `dart pub get --help`).
      - name: Pub get
        run: dart pub get --no-example

      - name: Analyze
        run: dart analyze lib bin test

      - name: Test
        run: dart test

  smoke-oap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    services:
      # 10.2.x removed embedded H2; 10.1.0 supports standalone default storage for CI smoke.
      oap:
        image: apache/skywalking-oap-server:10.1.0
        ports:
          - 11800:11800
        env:
          SW_HEALTH_CHECKER: default
        options: >-
          --health-cmd "bash -c '(echo >/dev/tcp/127.0.0.1/11800) || exit 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pub get
        run: dart pub get --no-example

      - name: Wait for OAP gRPC 11800
        run: |
          for i in $(seq 1 90); do
            if (echo >/dev/tcp/127.0.0.1/11800) 2>/dev/null; then
              echo "OAP TCP 11800 open after ${i} attempts; warm-up 20s for gRPC..."
              sleep 20
              exit 0
            fi
            sleep 2
          done
          echo "OAP gRPC 11800 not reachable (is OAP 10.1+ storage configured?)"
          exit 1

      - name: verify_native --quick
        env:
          SW_AGENT_COLLECTOR_BACKEND_SERVICES: 127.0.0.1:11800
          SKYWALKING_SERVICE_NAME: ci-smoke-my-app
        run: |
          for attempt in 1 2 3; do
            echo "verify_native attempt $attempt/3"
            if timeout 90 dart run bin/verify_native.dart --quick; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "retry in 10s (OAP gRPC may still be warming up)..."
              sleep 10
            fi
          done
          exit 1
