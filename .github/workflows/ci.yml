# Analyzer, unit tests, and optional OAP gRPC smoke (verify_native --quick).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Root package is pure Dart; `example/` needs Flutter SDK (see `dart pub get --help`).
      - name: Pub get
        run: dart pub get --no-example

      - name: Analyze
        run: dart analyze lib bin test

      - name: Test
        run: dart test

  smoke-oap:
    runs-on: ubuntu-latest
    needs: test
    services:
      oap:
        image: apache/skywalking-oap-server:10.2.0
        ports:
          - 11800:11800
        env:
          SW_STORAGE: h2
          SW_HEALTH_CHECKER: default
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pub get
        run: dart pub get --no-example

      - name: Wait for OAP gRPC 11800
        run: |
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/11800) 2>/dev/null; then
              echo "OAP gRPC ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "OAP gRPC 11800 not reachable"
          exit 1

      - name: verify_native --quick
        env:
          SW_AGENT_COLLECTOR_BACKEND_SERVICES: 127.0.0.1:11800
          SKYWALKING_SERVICE_NAME: ci-smoke-my-app
        run: dart run bin/verify_native.dart --quick
